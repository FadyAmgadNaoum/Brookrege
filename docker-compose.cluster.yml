# ─────────────────────────────────────────────────────────────────────────────
#  Phase 2 · Week 5 — the 3-server layout, simulated on ONE machine.
#
#    docker compose -f docker-compose.cluster.yml up --build -d
#    bash scripts/cluster/run-local-drill.sh          # all Week 5 tests
#
#  Website  http://localhost:8080      Admin  http://localhost:8081
#
#  "vps1" = lb + pg-primary + pgbouncer      "vps2" = api-1, web-1, admin-1 + pg-replica
#  "vps3" = api-2, web-2, admin-2
#  Uses the same Postgres entrypoint, pgBouncer image and proxy rules as production.
#  Reset everything: docker compose -f docker-compose.cluster.yml down -v
# ─────────────────────────────────────────────────────────────────────────────
name: brookrege-cluster

x-db: &db
  DB_USER: brookrege
  DB_PASSWORD: brookrege
  DB_NAME: brookrege

x-api: &api
  build: { context: ., dockerfile: apps/api/Dockerfile }
  depends_on: { pgbouncer: { condition: service_healthy } }
  volumes: [uploads:/data/uploads]   # stands in for the NFS share from VPS1

x-api-env: &api-env
  DATABASE_URL: postgresql://brookrege:brookrege@pgbouncer:6432/brookrege?pgbouncer=true&connection_limit=10
  DIRECT_DATABASE_URL: postgresql://brookrege:brookrege@pgbouncer:6432/brookrege_direct
  DATABASE_REPLICA_URL: postgresql://brookrege:brookrege@pgbouncer:6432/brookrege_ro?pgbouncer=true&connection_limit=5
  JWT_ACCESS_SECRET: local-cluster-secret-not-for-production-use-0123456789
  CORS_ORIGINS: http://localhost:8080,http://localhost:8081
  PUBLIC_API_URL: http://localhost:8080
  COOKIE_SECURE: "false"
  APP_ENV: local
  ADMIN_APP_URL: http://localhost:8081   # the admin's origin in this simulation (admin API only accepts it)
  SETTINGS_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  JOBS_WORKER: "false"

x-web: &web
  build:
    context: .
    dockerfile: apps/web/Dockerfile
    args: { NEXT_PUBLIC_API_URL: "http://localhost:8080", NEXT_PUBLIC_WHATSAPP_NUMBER: "201000000000" }

x-admin: &admin
  build: { context: ., dockerfile: apps/admin/Dockerfile, args: { NEXT_PUBLIC_API_URL: "" } }

services:
  pg-primary:
    image: postgres:15-alpine
    entrypoint: ["/opt/brookrege/entrypoint.sh"]
    environment:
      PG_ROLE: primary
      POSTGRES_USER: brookrege
      POSTGRES_PASSWORD: brookrege
      POSTGRES_DB: brookrege
      REPLICATION_PASSWORD: replicator
      REPLICATION_SLOT: replica_1
    volumes:
      - pg-primary:/var/lib/postgresql/data
      - ./infra/postgres/entrypoint.sh:/opt/brookrege/entrypoint.sh:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U brookrege"], interval: 3s, retries: 30 }

  pg-replica:
    image: postgres:15-alpine
    entrypoint: ["/opt/brookrege/entrypoint.sh"]
    environment:
      PG_ROLE: replica
      PRIMARY_HOST: pg-primary
      REPLICATION_PASSWORD: replicator
      REPLICATION_SLOT: replica_1
    volumes:
      - pg-replica:/var/lib/postgresql/data
      - ./infra/postgres/entrypoint.sh:/opt/brookrege/entrypoint.sh:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on: { pg-primary: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"], interval: 3s, retries: 60 }

  pgbouncer:
    build: ./infra/pgbouncer
    environment:
      <<: *db
      PRIMARY_HOST: pg-primary
      REPLICA_HOST: pg-replica
      PGPASSWORD: brookrege
    volumes: [pgbouncer-state:/state]
    depends_on:
      pg-primary: { condition: service_healthy }
      pg-replica: { condition: service_healthy }
    ports: ["6432:6432"]

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: app-1
      SEED_DEMO: "true"                   # only one instance loads demo data
      SEED_ADMIN_EMAIL: admin@brookrege.com
      SEED_ADMIN_PASSWORD: Brookrege-Demo-2026!
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: app-2
    depends_on: { api-1: { condition: service_healthy } }

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    environment:
      <<: *api-env
      INSTANCE_ID: worker
    depends_on: { api-1: { condition: service_healthy } }

  web-1:
    <<: *web
    environment: { INSTANCE_ID: web-1, API_INTERNAL_URL: "http://api-1:4000" }
    depends_on: { api-1: { condition: service_healthy } }
  web-2:
    <<: *web
    environment: { INSTANCE_ID: web-2, API_INTERNAL_URL: "http://api-2:4000" }
    depends_on: { api-2: { condition: service_healthy } }

  admin-1: { <<: *admin, environment: { INSTANCE_ID: admin-1 } }
  admin-2: { <<: *admin, environment: { INSTANCE_ID: admin-2 } }

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80", "8081:81"]
    volumes:
      - ./infra/nginx/cluster-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - uploads:/data/uploads:ro
    depends_on: [api-1, api-2, web-1, web-2, admin-1, admin-2]

volumes:
  pg-primary:
  pg-replica:
  pgbouncer-state:
  uploads:
