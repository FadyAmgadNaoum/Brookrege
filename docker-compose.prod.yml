# Phase 1 production: everything on ONE VPS. Phase 2 splits this across 3 VPS.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Phase 4: query statistics (pg_stat_statements) and a log line for every query slower than 500 ms.
    command: >-
      postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=top
      -c log_min_duration_statement=${PG_SLOW_QUERY_MS:-500} -c track_io_timing=on
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB} -c max_connections=${PG_MAX_CONNECTIONS:-100}
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"], interval: 10s, retries: 10 }
    networks: [internal]
    # Only on this server's loopback, for the monitoring exporter — never reachable from the internet.
    ports: ["127.0.0.1:5432:5432"]

  # Shared cache (Phase 4). Cache only: nothing is persisted, losing it just means a few slower requests.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru --save "" --appendonly no --protected-mode yes
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"], interval: 10s, retries: 5 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [internal]
    ports: ["127.0.0.1:6379:6379"]   # loopback only, for the monitoring exporter

  api:
    image: ${IMAGE_REGISTRY:-brookrege}/api:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build: { context: ., dockerfile: apps/api/Dockerfile, args: { APP_VERSION: "${APP_VERSION:-dev}" } }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public&connection_limit=15
      DIRECT_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: https://${PUBLIC_DOMAIN},https://${ADMIN_DOMAIN}
      PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      TZ_NAME: Africa/Cairo
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ADMIN_APP_URL: https://${ADMIN_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
      # First deploy only: creates the first super admin if none exists (no demo data in production).
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    volumes: [uploads:/data/uploads]
    networks: [internal]
    ports: ["127.0.0.1:9464:9464"]   # Prometheus metrics, loopback only

  web:
    image: ${IMAGE_REGISTRY:-brookrege}/web${WEB_VARIANT:-}:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
    depends_on: [api]
    networks: [internal]

  admin:
    image: ${IMAGE_REGISTRY:-brookrege}/admin:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "" # same-origin: Nginx proxies /api on the admin domain
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "127.0.0.1:8088:8088"]   # 8088 = stub_status for the monitoring exporter
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      TLS_PROTOCOLS: ${TLS_PROTOCOLS:-TLSv1.2 TLSv1.3}   # "TLSv1.3" once Cloudflare proxies the site
      ORIGIN_PULL: ${ORIGIN_PULL:-off}                   # "on" = accept only Cloudflare (docs/security/INFRASTRUCTURE.md)
      SITE_ACCESS: ${SITE_ACCESS:-public}                 # "staging" = password + noindex (docker-compose.staging.yml)
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - /etc/brookrege/cloudflare:/etc/nginx/cloudflare:ro   # Cloudflare IP ranges + origin-pull CA (infra/cloudflare/sync-ips.sh)
      - ./infra/nginx/upstreams/single-server.conf:/etc/nginx/upstreams.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - uploads:/data/uploads:ro
    depends_on: [web, admin, api]
    networks: [internal]

  backup:
    image: ${IMAGE_REGISTRY:-brookrege}/backup:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build: ./infra/backup
    restart: unless-stopped
    # Nightly ENCRYPTED backup (infra/backup/backup.sh). Only the public key is on this server.
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
      TZ: Africa/Cairo
      # Optional off-site copy to Cloudflare R2 (encrypted files only):
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:-none}.r2.cloudflarestorage.com
    volumes:
      - ./backups:/backups
      - /var/lib/node_exporter/textfile:/metrics   # backup result for monitoring (BackupTooOld alert)
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

volumes:
  pgdata:
  uploads:
  certbot-www:

networks:
  internal:
