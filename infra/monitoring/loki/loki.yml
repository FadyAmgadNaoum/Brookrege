# Loki (logs), single process with local disk. Runs on VPS1; Alloy on every server pushes logs here.
# Retention: 14 days (docs/operations/MONITORING.md → "What is kept, and for how long").
auth_enabled: false

server:
  http_listen_address: ${LOKI_LISTEN_ADDRESS:-127.0.0.1}
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h           # 14 days
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_lookback: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
