# Local simulation of the Phase 2 load balancer (docker-compose.cluster.yml). Plain HTTP:
#   :80 (host 8080)  public site + public API      :81 (host 8081)  admin + admin API
# Same algorithm, health rules and proxy settings as production (upstreams/multi-server.conf).

server_tokens off;
limit_req_status 429;

log_format lb '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log lb;

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

upstream api   { least_conn; server api-1:4000 max_fails=3 fail_timeout=15s;   server api-2:4000 max_fails=3 fail_timeout=15s;   keepalive 32; }
upstream web   { least_conn; server web-1:3000 max_fails=3 fail_timeout=15s;   server web-2:3000 max_fails=3 fail_timeout=15s;   keepalive 32; }
upstream admin { least_conn; server admin-1:3001 max_fails=3 fail_timeout=15s; server admin-2:3001 max_fails=3 fail_timeout=15s; keepalive 8; }

server {
  listen 80;
  client_max_body_size 1m;
  include /etc/nginx/snippets/block-probes.conf;
  location /uploads/ { alias /data/uploads/; expires 30d; }
  location /api/admin/ { return 404; }
  location /api/ { limit_req zone=api burst=100 nodelay; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
  location / { include /etc/nginx/snippets/proxy.conf; proxy_pass http://web; }
  # Which web server answered — used by the distribution test.
  location = /lb/web-health { include /etc/nginx/snippets/proxy.conf; proxy_pass http://web/healthz; }
}

server {
  listen 81;
  client_max_body_size 300m;
  include /etc/nginx/snippets/block-probes.conf;
  location /uploads/ { alias /data/uploads/; expires 30d; }
  location /api/ { include /etc/nginx/snippets/proxy.conf; proxy_request_buffering off; client_body_timeout 300s; proxy_read_timeout 300s; proxy_pass http://api; }
  location / { include /etc/nginx/snippets/proxy.conf; proxy_pass http://admin; }
}
