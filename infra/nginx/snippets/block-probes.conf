# Automated scanners probe for files and apps we don't have. Answer 404 without touching the apps.
# Hidden files (.env, .git, .DS_Store …) — except /.well-known/ (certificate validation).
location ~ /\.(?!well-known/) { access_log off; return 404; }
# Server-side script and backup extensions this site never serves.
location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|sql|bak|old|orig|swp|ini|log|sh)$ { access_log off; return 404; }
# Common CMS/admin tool paths.
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|myadmin|cgi-bin|vendor/phpunit|actuator|server-status) { access_log off; return 404; }
