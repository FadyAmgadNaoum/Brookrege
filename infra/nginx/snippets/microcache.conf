# Micro-cache (Phase 4): each page/API response is reused for up to 10 seconds, so a traffic spike reaches
# the app servers as at most one request per URL per 10 s. Only anonymous GET/HEAD of the PUBLIC site;
# never the admin. Next.js client navigations (RSC header) are passed through uncached because their
# content depends on request headers the cache key doesn't include.
proxy_cache microcache;
# Origin is part of the key because CORS answers differ per calling site.
proxy_cache_key "$scheme$host$request_uri|$http_origin";
# Ask the app for uncompressed responses: nginx compresses for each visitor, so one cached copy fits all.
proxy_set_header Accept-Encoding "";
proxy_cache_methods GET HEAD;
proxy_ignore_headers Cache-Control Expires;   # the app says "no-store" for dynamic pages; 10 s is safe here
proxy_cache_valid 200 10s;
proxy_cache_valid 404 5s;
proxy_cache_bypass $http_rsc $http_next_router_prefetch $microcache_skip;
proxy_no_cache $http_rsc $http_next_router_prefetch $microcache_skip;
# One request refreshes an expired entry while others get the previous copy; if the app servers are down,
# visitors still get the last good page for up to 10 minutes instead of an error.
proxy_cache_lock on;
proxy_cache_lock_timeout 3s;
proxy_cache_background_update on;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
add_header X-Cache $upstream_cache_status always;
include /etc/nginx/snippets/security.conf;
