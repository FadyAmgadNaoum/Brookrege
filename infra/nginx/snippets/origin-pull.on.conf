# Authenticated Origin Pulls: ON (ORIGIN_PULL=on). Only TLS connections presenting Cloudflare's client
# certificate are accepted, so the server can't be reached around Cloudflare's WAF/DDoS protection.
# The CA file is downloaded by infra/cloudflare/sync-ips.sh.
ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
ssl_verify_client on;
