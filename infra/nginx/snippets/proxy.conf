proxy_http_version 1.1;
proxy_set_header Host $host;
# The real client address (after the Cloudflare real-IP step). Overwritten, never appended to, so a
# visitor can't smuggle a fake address in via their own X-Forwarded-For header.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_hide_header X-Powered-By;
# proxy_read_timeout is NOT set here (nginx default 60 s): locations that need longer set it themselves.
# Setting it here too would make those locations fail with "directive is duplicate".
# Fail fast on a dead app server and retry the request on the other one.
# Nginx never retries POST/PATCH/DELETE (non-idempotent) automatically — a form is never submitted twice.
proxy_connect_timeout 3s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
