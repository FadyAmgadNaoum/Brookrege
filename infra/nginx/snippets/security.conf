# Response headers for every HTTPS response. (add_header isn't inherited by a location that sets its
# own add_header, so locations that add headers include this file again.)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag $robots_tag always;   # empty on the live site; "noindex, nofollow" on staging (robots.*.conf)
