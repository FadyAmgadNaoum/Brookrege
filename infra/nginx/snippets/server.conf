# Included in every public-facing server block.
# JSON access log to stdout (the nginx image links access.log to the container output). Format: default.conf.template.
access_log /var/log/nginx/access.log brookrege_json;
# Idle keep-alive connections are closed after 30 s (the image default of 65 s holds sockets longer than needed).
keepalive_timeout 30s;
