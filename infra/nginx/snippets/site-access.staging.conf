# Site access: STAGING (SITE_ACCESS=staging, docker-compose.staging.yml). Password-protected and never indexed,
# so test data can't leak into search results or be mistaken for the real site.
# The password file lives on the server: /etc/brookrege/staging/htpasswd (docs/operations/STAGING.md).
auth_basic "Brookrege staging";
auth_basic_user_file /etc/nginx/staging/htpasswd;
# "noindex" is sent by snippets/security.conf ($robots_tag, snippets/robots.staging.conf), so it also reaches
# locations that set their own headers (nginx drops server-level add_header there).
# Uptime checks stay possible without the password (the answer contains no data).
location = /api/health { auth_basic off; include /etc/nginx/snippets/proxy.conf; proxy_pass http://api; }
