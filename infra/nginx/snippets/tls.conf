# TLS settings shared by every HTTPS server (Mozilla "intermediate" profile; protocols come from
# TLS_PROTOCOLS in the template: TLS 1.2+1.3 by default, TLS 1.3 only once Cloudflare fronts the site).
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
# No OCSP stapling: Let's Encrypt ended its OCSP service in August 2025.
