# Phase 2: VPS2 (10.0.0.2) and VPS3 (10.0.0.3) over the WireGuard private network.
# least_conn sends each request to the server with fewer active connections.
# Passive health checks: 3 failures within 15s take a server out for 15s, then Nginx tries it again.
upstream api {
  least_conn;
  server 10.0.0.2:4000 max_fails=3 fail_timeout=15s;
  server 10.0.0.3:4000 max_fails=3 fail_timeout=15s;
  keepalive 32;
}
upstream web {
  least_conn;
  server 10.0.0.2:3000 max_fails=3 fail_timeout=15s;
  server 10.0.0.3:3000 max_fails=3 fail_timeout=15s;
  keepalive 32;
}
upstream admin {
  least_conn;
  server 10.0.0.2:3001 max_fails=3 fail_timeout=15s;
  server 10.0.0.3:3001 max_fails=3 fail_timeout=15s;
  keepalive 8;
}
