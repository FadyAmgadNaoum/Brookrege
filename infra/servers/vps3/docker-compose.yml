# VPS3 — app server 2. Private address 10.0.0.3 (no public ports).
# Run from this folder:  docker compose --env-file ../../../.env.cluster up -d --build
# Also hosts Redis (shared cache for both API servers), bound to the private address only.
name: brookrege-vps3
services:
  # Shared cache for the API servers on VPS2 and VPS3 (Phase 4). Cache only, no persistence.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"], interval: 10s, retries: 5 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    ports: ["10.0.0.3:6379:6379"]   # private network only (firewall: from VPS2)

  api:
    image: ${IMAGE_REGISTRY:-brookrege}/api:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build: { context: ../../.., dockerfile: apps/api/Dockerfile, args: { APP_VERSION: "${APP_VERSION:-dev}" } }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INSTANCE_ID: vps3
      # All database traffic goes through pgBouncer on VPS1 (the failover script re-points it there).
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}_direct
      DATABASE_REPLICA_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}_ro?pgbouncer=true&connection_limit=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: https://${PUBLIC_DOMAIN},https://${ADMIN_DOMAIN}
      PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      TZ_NAME: Africa/Cairo
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ADMIN_APP_URL: https://${ADMIN_DOMAIN}
      JOBS_WORKER: "false"            # background jobs run in the dedicated worker on VPS3
      REDIS_URL: redis://:${REDIS_PASSWORD}@10.0.0.3:6379/0
    volumes: ["/srv/brookrege/uploads:/data/uploads"]   # NFS mount from VPS1 — both servers see the same photos
    ports: ["10.0.0.3:4000:4000", "10.0.0.3:9464:9464"]   # 9464 = metrics for Prometheus on VPS1

  # Background jobs: emails, SMS, video thumbnails, scheduled reports, media clean-up.
  # Safe to run more than one (jobs are claimed with FOR UPDATE SKIP LOCKED).
  worker:
    image: ${IMAGE_REGISTRY:-brookrege}/api:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build: { context: ../../.., dockerfile: apps/api/Dockerfile, args: { APP_VERSION: "${APP_VERSION:-dev}" } }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    ports: ["10.0.0.3:9465:9464"]   # worker metrics for Prometheus on VPS1
    environment:
      NODE_ENV: production
      INSTANCE_ID: vps3-worker
      # All database traffic goes through pgBouncer on VPS1 (the failover script re-points it there).
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}?pgbouncer=true&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}_direct
      DATABASE_REPLICA_URL: postgresql://${DB_USER}:${DB_PASSWORD}@10.0.0.1:6432/${DB_NAME}_ro?pgbouncer=true&connection_limit=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGINS: https://${PUBLIC_DOMAIN},https://${ADMIN_DOMAIN}
      PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      TZ_NAME: Africa/Cairo
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ADMIN_APP_URL: https://${ADMIN_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@10.0.0.3:6379/0
    volumes: ["/srv/brookrege/uploads:/data/uploads"]
    depends_on: { api: { condition: service_healthy } }   # api applies migrations first

  web:
    image: ${IMAGE_REGISTRY:-brookrege}/web${WEB_VARIANT:-}:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "https://${PUBLIC_DOMAIN}", NEXT_PUBLIC_WHATSAPP_NUMBER: "${WHATSAPP_NUMBER}" }
    restart: unless-stopped
    environment:
      INSTANCE_ID: vps3
      API_INTERNAL_URL: http://api:4000    # server-side rendering calls the API on the same VPS
      NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER}
    depends_on: { api: { condition: service_healthy } }
    ports: ["10.0.0.3:3000:3000"]

  admin:
    image: ${IMAGE_REGISTRY:-brookrege}/admin:${IMAGE_TAG:-local}   # CI-built image (scripts/deploy); "build" is for local use
    build: { context: ../../.., dockerfile: apps/admin/Dockerfile, args: { NEXT_PUBLIC_API_URL: "" } }
    restart: unless-stopped
    environment: { INSTANCE_ID: vps3 }
    ports: ["10.0.0.3:3001:3001"]
